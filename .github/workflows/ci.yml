name: ci

on:
  push:
    branches: [main, "ci/**"]
    tags: ["*"]
  pull_request:

# A newer push to the same ref supersedes a run, on main too: the newest commit publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The gate faces the internet: a RustSec advisory against any dependency fails the build.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Each image is built once per run, natively for each platform, and pushed by digest; images
  # tags the platforms together as ci-<commit>, which every test pulls and publish retags.
  # A pull request from a fork cannot push to the registry: it builds the images, unpushed, and
  # skips the jobs that need them.
  image:
    name: image (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      CACHE: type=registry,ref=ghcr.io/adamaq01/corral-buildcache:${{ matrix.image.name }}-${{ matrix.platform.arch }}
    strategy:
      matrix:
        image:
          - name: corral
            file: images/server/Dockerfile
          - name: corral-sandbox
            file: images/sandbox/Dockerfile
          - name: corral-overlay
            file: images/overlay/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adamaq01/${{ matrix.image.name }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/adamaq01/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: ${{ env.CACHE }}
          cache-to: ${{ env.PUSH == 'true' && format('{0},mode=max,ignore-error=true', env.CACHE) || '' }}
      - if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          touch "$RUNNER_TEMP/digest/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  images:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          for image in corral corral-sandbox corral-overlay; do
            sources=()
            for digest in "digest-$image-amd64"/* "digest-$image-arm64"/*; do
              sources+=("ghcr.io/adamaq01/$image@sha256:${digest#*/}")
            done
            docker buildx imagetools create --tag "ghcr.io/adamaq01/$image:ci-$GITHUB_SHA" "${sources[@]}"
          done

  test:
    needs: [images]
    runs-on: ubuntu-latest
    env:
      CORRAL_SERVER_IMAGE: corral-server:e2e
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: images/sandbox/test.sh
      - run: images/overlay/test.sh
      # Every test but the agent-sandbox cluster tests, which need a kind cluster: engine-kind runs them.
      - run: cargo test --workspace --all-features --exclude corral-engine-agent-sandbox
      - run: cargo test --package corral-engine-agent-sandbox --all-features --lib
      - name: Install hc, the version and checksum the overlay pins
        run: |
          version=$(sed -n 's/^ARG HERDR_CORE_VERSION=//p' images/overlay/Dockerfile)
          sha256=$(sed -n 's/^ARG HERDR_CORE_SHA256_AMD64=//p' images/overlay/Dockerfile)
          curl -fsSL -o "$RUNNER_TEMP/herdr-core.tar.gz" \
            "https://releases.herdr.dev/core/$version/herdr-core-linux-x86_64.tar.gz"
          echo "$sha256  $RUNNER_TEMP/herdr-core.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/herdr-core.tar.gz" -C "$HOME/.local/bin" --no-same-owner herdr-core
          ln -s herdr-core "$HOME/.local/bin/hc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tests/e2e/compose.sh
      # The opkssh e2e drives its browser steps with the web UI's Playwright.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: tests/e2e/opkssh.sh

  web:
    needs: [images]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      # The user journey creates sandboxes from these images.
      - uses: ./.github/actions/ci-images
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Playwright harness builds and runs the real corral-server, the same build chart caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: false
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # test.sh checks the config the chart renders with corral-server config check.
      - run: cargo build --package corral-server
      - run: |
          deploy/helm/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/helm/test.sh

  chart-kind:
    needs: [images]
    runs-on: ubuntu-latest
    env:
      CORRAL_SERVER_IMAGE: corral-server:e2e
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      # The sandbox image is loaded into the kind node too, which needs room for a second copy.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - name: Install kind and the chart tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/kind" "$RUNNER_TEMP/bin/kind"
          deploy/helm/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/helm/e2e.sh

  engine-kind:
    needs: [images]
    runs-on: ubuntu-latest
    env:
      CI: "1"
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
      CORRAL_TEST_KUBE_NAMESPACE: corral-dev
    steps:
      # The sandbox image is loaded into the kind node too, which needs room for a second copy.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      # The cluster tests build a part of what test does, so they restore its cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - name: Install kind
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/kind" "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: crates/corral-engine-agent-sandbox/tests/kind/up.sh
      - run: cargo test --package corral-engine-agent-sandbox --all-features --test cluster -- --test-threads=1

  # Publishing retags the images every check ran against, so it ships exactly those.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [check, deny, test, web, chart, chart-kind, engine-kind]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [corral, corral-sandbox, corral-overlay]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adamaq01/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            "ghcr.io/adamaq01/$IMAGE:ci-$GITHUB_SHA"
        env:
          IMAGE: ${{ matrix.image }}

  # The chart's appVersion is the image tag this run published, so it runs exactly that image.
  publish-chart:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          deploy/helm/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/helm/package.sh "$RUNNER_TEMP/chart"
      - run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: helm push "$RUNNER_TEMP"/chart/corral-*.tgz oci://ghcr.io/adamaq01/charts
