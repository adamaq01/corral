name: ci

on:
  push:
    branches: [main, "ci/**"]
    tags: ["*"]
  pull_request:

# A newer push to the same ref supersedes a run, on main too: the newest commit publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # The jobs this run needs, which tests/affected.sh picks from the paths changed since the last
  # commit whose push run passed on this branch, so the changes of a cancelled or failed run are
  # tested again; for a pull request, since its base. Tags need every job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      jobs: ${{ steps.affected.outputs.jobs }}
      images: ${{ steps.affected.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            pull_request/*) base=$PR_BASE ;;
            push/branch)
              base=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --event push \
                --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
              ;;
          esac
          if [[ -n "$base" ]] && { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --quiet origin "$base"; }; then
            selected=$(CORRAL_BASE=$base tests/affected.sh jobs)
          else
            selected=$(tests/affected.sh all)
          fi
          images=false
          if grep -qxE 'rust|web|images|compose|kind' <<<"$selected"; then
            images=true
          fi
          echo "Jobs for the changes since ${base:-the start}: [${selected//$'\n'/ }]" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "jobs=$(jq -cnR '[inputs | select(. != "")]' <<<"$selected")"
            echo "images=$images"
          } >>"$GITHUB_OUTPUT"

  # Each image is built once per run, natively for each platform, and pushed by digest; images
  # tags the platforms together as ci-<commit>, which every test pulls and publish retags.
  # A pull request from a fork cannot push to the registry: it builds the images, unpushed, and
  # skips the jobs that need them.
  image:
    name: image (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      CACHE: type=registry,ref=ghcr.io/adamaq01/corral-buildcache:${{ matrix.image.name }}-${{ matrix.platform.arch }}
    strategy:
      matrix:
        image:
          - name: corral
            file: images/server/Dockerfile
          - name: corral-sandbox
            file: images/sandbox/Dockerfile
          - name: corral-overlay
            file: images/overlay/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adamaq01/${{ matrix.image.name }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/adamaq01/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: ${{ env.CACHE }}
          cache-to: ${{ env.PUSH == 'true' && format('{0},mode=max,ignore-error=true', env.CACHE) || '' }}
      - if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          touch "$RUNNER_TEMP/digest/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  images:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          for image in corral corral-sandbox corral-overlay; do
            sources=()
            for digest in "digest-$image-amd64"/* "digest-$image-arm64"/*; do
              sources+=("ghcr.io/adamaq01/$image@sha256:${digest#*/}")
            done
            docker buildx imagetools create --tag "ghcr.io/adamaq01/$image:ci-$GITHUB_SHA" "${sources[@]}"
          done

  rust:
    needs: [changes, images]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust')
    runs-on: ubuntu-latest
    env:
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: just@1.59.0,cargo-nextest@0.9.152
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just ci-rust
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  web:
    needs: [changes, images]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'web')
    runs-on: ubuntu-latest
    env:
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: just@1.59.0
      # The Playwright harness builds and runs the real corral-server, the same build chart caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: false
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: just ci-web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  images-test:
    needs: [changes, images]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'images')
    runs-on: ubuntu-latest
    env:
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: just@1.59.0
      - run: just ci-images

  compose:
    needs: [changes, images]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'compose')
    runs-on: ubuntu-latest
    env:
      CORRAL_SERVER_IMAGE: corral-server:e2e
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: just@1.59.0
      - run: just ci-compose

  # On one kind cluster, the agent-sandbox engine's cluster tests, then the chart e2e.
  kind:
    needs: [changes, images]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'kind')
    runs-on: ubuntu-latest
    env:
      CORRAL_SERVER_IMAGE: corral-server:e2e
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
      CORRAL_OVERLAY_IMAGE: corral-overlay:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-images
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: just@1.59.0,cargo-nextest@0.9.152
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - name: Install kind and the chart tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/kind" "$RUNNER_TEMP/bin/kind"
          deploy/helm/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: just ci-kind

  chart:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'chart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          deploy/helm/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: just ci-chart

  # The gate faces the internet: a RustSec advisory against any dependency fails the build.
  deny:
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'deny')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Publishing retags the images every check ran against, so it ships exactly those. It runs when
  # this run built images and no job failed or was cancelled; a job the changes did not need is
  # skipped and does not hold it back.
  publish:
    if: >-
      always() && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      && needs.images.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, images, rust, web, images-test, compose, kind, chart, deny]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [corral, corral-sandbox, corral-overlay]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adamaq01/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            "ghcr.io/adamaq01/$IMAGE:ci-$GITHUB_SHA"
        env:
          IMAGE: ${{ matrix.image }}

  # The chart's appVersion is the image tag this run published, so it runs exactly that image.
  publish-chart:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          deploy/helm/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/helm/package.sh "$RUNNER_TEMP/chart"
      - run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: helm push "$RUNNER_TEMP"/chart/corral-*.tgz oci://ghcr.io/adamaq01/charts
