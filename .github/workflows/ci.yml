name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      CORRAL_SERVER_IMAGE: corral-server:e2e
      CORRAL_SANDBOX_IMAGE: corral-sandbox:e2e
    steps:
      # The runner's preinstalled SDKs leave too little disk for the images plus the test build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: images/server/Dockerfile
          load: true
          tags: corral-server:e2e
          cache-from: type=gha,scope=corral
      - uses: docker/build-push-action@v7
        with:
          context: images/sandbox
          file: images/sandbox/Dockerfile
          load: true
          tags: corral-sandbox:e2e
          cache-from: type=gha,scope=corral-sandbox
      - run: images/sandbox/test.sh
      # Every test but the agent-sandbox cluster tests, which need a kind cluster and run locally.
      - run: cargo test --workspace --all-features --exclude corral-engine-agent-sandbox
      - run: cargo test --package corral-engine-agent-sandbox --all-features --lib
      - name: Install hc, the version and checksum the sandbox image pins
        run: |
          version=$(sed -n 's/^ARG HERDR_CORE_VERSION=//p' images/sandbox/Dockerfile)
          sha256=$(sed -n 's/^ARG HERDR_CORE_SHA256_AMD64=//p' images/sandbox/Dockerfile)
          curl -fsSL -o "$RUNNER_TEMP/herdr-core.tar.gz" \
            "https://releases.herdr.dev/core/$version/herdr-core-linux-x86_64.tar.gz"
          echo "$sha256  $RUNNER_TEMP/herdr-core.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/herdr-core.tar.gz" -C "$HOME/.local/bin" --no-same-owner herdr-core
          ln -s herdr-core "$HOME/.local/bin/hc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tests/e2e/compose.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Playwright harness builds and runs the real corral-server.
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: [check, test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: corral
            context: .
            file: images/server/Dockerfile
          - name: corral-sandbox
            context: images/sandbox
            file: images/sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/adamaq01/${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
