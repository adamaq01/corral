name: ci-images
description: Pulls the images this run built and tags them with the names the tests use.
runs:
  using: composite
  steps:
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - shell: bash
      env:
        TAG: ci-${{ github.sha }}
      run: |
        for pair in corral=corral-server corral-sandbox=corral-sandbox corral-overlay=corral-overlay; do
          docker pull --quiet "ghcr.io/adamaq01/${pair%%=*}:$TAG"
          docker tag "ghcr.io/adamaq01/${pair%%=*}:$TAG" "${pair#*=}:e2e"
        done
