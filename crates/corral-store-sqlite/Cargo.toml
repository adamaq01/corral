[package]
name = "corral-store-sqlite"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
corral-core = { path = "../corral-core" }
sqlx = { version = "0.9.1", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
uuid.workspace = true

[dev-dependencies]
corral-core = { path = "../corral-core", features = ["contract"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
