[package]
name = "corral-store-postgres"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
corral-core = { path = "../corral-core" }
sqlx = { version = "0.9.1", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
uuid.workspace = true

[dev-dependencies]
corral-core = { path = "../corral-core", features = ["contract"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
