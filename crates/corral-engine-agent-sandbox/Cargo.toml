[package]
name = "corral-engine-agent-sandbox"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
corral-activity = { path = "../corral-activity" }
corral-core = { path = "../corral-core" }
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { workspace = true, features = ["derive", "http-proxy", "ws"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
