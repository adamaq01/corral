[package]
name = "corral-identity-oidc"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
corral-api = { path = "../corral-api" }
corral-core = { path = "../corral-core" }
openidconnect = { version = "4.1.0", features = ["timing-resistant-secret-traits"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
chrono.workspace = true
corral-api = { path = "../corral-api", features = ["testing"] }
corral-core = { path = "../corral-core", features = ["fakes"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = "0.6.5"

[lints]
workspace = true
