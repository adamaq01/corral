[package]
name = "corral-api"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
chrono = { workspace = true, features = ["serde"] }
cookie = "0.18.2"
corral-core = { path = "../corral-core" }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
async-trait.workspace = true
corral-core = { path = "../corral-core", features = ["fakes"] }
corral-identity-local = { path = "../corral-identity-local" }
corral-sql = { path = "../corral-sql", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
