[package]
name = "corral-api"
version.workspace = true
edition.workspace = true

[features]
testing = ["corral-core/fakes", "dep:tower"]

[dependencies]
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
cookie = "0.18.2"
form_urlencoded = "1.2.3"
corral-core = { path = "../corral-core" }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"], optional = true }
tracing.workspace = true
ts-rs = { workspace = true, features = ["chrono-impl", "uuid-impl"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
async-trait.workspace = true
corral-api = { path = ".", features = ["testing"] }
corral-sql = { path = "../corral-sql", features = ["testing"] }
corral-store-sql = { path = "../corral-store-sql" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
