[package]
name = "corral-secrets-database"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
async-trait.workspace = true
base64.workspace = true
corral-core = { path = "../corral-core" }
corral-sql = { path = "../corral-sql" }
secrecy.workspace = true
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "sqlite", "uuid"] }
zeroize = "1.9.2"

[dev-dependencies]
corral-core = { path = "../corral-core", features = ["contract"] }
corral-sql = { path = "../corral-sql", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
uuid.workspace = true

[lints]
workspace = true
