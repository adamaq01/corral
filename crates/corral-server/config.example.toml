# Kubernetes homelab: agent-sandbox engine, OIDC login, Postgres.
#
# Secrets and the database come from the environment, never from this file:
#   DATABASE_URL=postgres://corral:...@corral-db-rw:5432/corral
#   CORRAL_SESSION_KEY, CORRAL_SECRETS_KEY, CORRAL_GATE_SECRET (`corral-server keys generate`),
#   the last for the gate too
#   CORRAL_OIDC_CLIENT_SECRET

[http]
public_addr = "0.0.0.0:8080"
internal_addr = "0.0.0.0:8081"
base_url = "https://corral.adamaq01.fr"
# Where the `corral` command inside a sandbox reaches the API, when not at base_url.
# sandbox_base_url = "http://corral.corral.svc:8080"
# Behind Traefik every peer is the proxy, so password-login limits key on X-Forwarded-For.
trust_forwarded_for = true
# The built web UI. The server image has it in /usr/share/corral/web, which is the default.
# ui_dir = "/usr/share/corral/web"

[identity.oidc]
issuer = "https://auth.adamaq01.fr"
client_id = "corral"
member_group = "corral-users"
admin_group = "corral-admins"

# Users who run `opkssh login` with the issuer's public client `opkssh` reach SSH without
# registering a key. Their certificates last 12h, 24h, 48h or 1week.
[identity.oidc.opkssh]
client_id = "opkssh"
policy = "24h"

[secrets]
kind = "database"

[engine]
kind = "agent-sandbox"
namespace = "corral-sandboxes"
service_account = "corral-sandbox"
storage_class = "tns-csi-nvmeof"
# The Corral overlay every sandbox mounts at /opt/corral, whatever its image.
overlay_image = "ghcr.io/adamaq01/corral-overlay:latest"

# A sandbox sleeps after its idle timeout with no work: no input through SSH (keystrokes,
# commands, file transfers, forwarded traffic) and its own processor and network use, which it
# reports every report_interval_secs, below the busy thresholds. An open connection alone is not
# work. Owners choose a sandbox's timeout up to max_timeout_secs, and keep it awake up to
# max_keep_awake_secs ahead.
[idle]
timeout_secs = 1800
max_timeout_secs = 86400
max_keep_awake_secs = 604800
check_interval_secs = 60
report_interval_secs = 60
busy_cpu_percent = 2.0
busy_network_bytes_per_sec = 4096

# The SSH front door, `corral-server gate`, which reads this same file.
[frontdoor]
kind = "gate"
listen_addr = "0.0.0.0:2222"
host_key_file = "/etc/corral/ssh/host_key"
# The server's internal listener, which answers the gate alone.
server_url = "http://corral.corral.svc:8081"
# Public SSH arrives through a rathole client pod, so every public client shares its address.
# Connections from the pod network are never locked out by address.
lockout_exempt_networks = ["10.42.0.0/16"]

[ssh]
public_host = "corral.adamaq01.fr"
public_port = 48291
wake_deadline_secs = 20

[limits]
max_sandboxes_per_user = 5
# Sandboxes awake at once, across all users.
max_running = 6

# Users may also name images of their own from these registries, up to this download size.
[catalog.named_images]
registries = ["docker.io", "ghcr.io/adamaq01"]
max_size = "5Gi"

# The first image and the first size are the defaults.
[[catalog.images]]
key = "ubuntu"
label = "Ubuntu 24.04"
reference = "ghcr.io/adamaq01/corral-sandbox:latest"

[[catalog.sizes]]
key = "small"
label = "Small: 2 CPUs, 4 GiB"
cpu_request = "500m"
cpu_limit = "2"
memory_request = "1Gi"
memory_limit = "4Gi"
home_size = "10Gi"

[[catalog.sizes]]
key = "large"
label = "Large: 4 CPUs, 8 GiB"
cpu_request = "1"
cpu_limit = "4"
memory_request = "2Gi"
memory_limit = "8Gi"
home_size = "30Gi"
