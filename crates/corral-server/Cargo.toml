[package]
name = "corral-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum.workspace = true
base64.workspace = true
clap = { version = "4.6.9", features = ["derive", "env"] }
corral-activity = { path = "../corral-activity" }
corral-api = { path = "../corral-api" }
corral-core = { path = "../corral-core" }
corral-engine-agent-sandbox = { path = "../corral-engine-agent-sandbox" }
corral-engine-docker = { path = "../corral-engine-docker" }
corral-frontdoor-containerssh = { path = "../corral-frontdoor-containerssh" }
corral-identity-local = { path = "../corral-identity-local" }
corral-identity-oidc = { path = "../corral-identity-oidc" }
corral-secrets-database = { path = "../corral-secrets-database" }
corral-secrets-vault = { path = "../corral-secrets-vault" }
corral-sql = { path = "../corral-sql" }
corral-store-sql = { path = "../corral-store-sql" }
kube.workspace = true
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
secrecy.workspace = true
serde.workspace = true
sha2 = "0.11.1"
ssh-key = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
corral-api = { path = "../corral-api", features = ["testing"] }
corral-core = { path = "../corral-core", features = ["fakes"] }
corral-sql = { path = "../corral-sql", features = ["testing"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "sqlite"] }
tempfile.workspace = true

[lints]
workspace = true
