[package]
name = "corral-store-sql"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
corral-core = { path = "../corral-core" }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "uuid"] }
uuid.workspace = true
zeroize = "1.9.2"

[dev-dependencies]
corral-core = { path = "../corral-core", features = ["contract"] }
sqlx = { workspace = true, features = ["any"] }
tempfile.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
