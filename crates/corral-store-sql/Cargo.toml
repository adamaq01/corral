[package]
name = "corral-store-sql"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
corral-core = { path = "../corral-core" }
corral-sql = { path = "../corral-sql" }
sqlx = { workspace = true, features = ["chrono", "macros", "migrate", "postgres", "sqlite", "uuid"] }
uuid.workspace = true

[dev-dependencies]
corral-core = { path = "../corral-core", features = ["contract"] }
corral-sql = { path = "../corral-sql", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
