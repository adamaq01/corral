# Minimal config for the Docker Compose install. Every other setting has a default.

[http]
# The address people open in a browser.
base_url = "http://corral.example.lan:8080"

# Local accounts, created with `corral-server local-account create`.
[identity.local]

[ssh]
# The host name people pass to ssh; port 48291 unless [ssh] public_port says otherwise.
public_host = "corral.example.lan"
