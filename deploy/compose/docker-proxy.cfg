# The gate's only way to Docker: what it needs to run sessions in sandboxes, nothing more. It may
# create an exec in a sandbox container (named corral-<sandbox id>), then start, resize and
# inspect that exec. Every other call is refused: it cannot create, start, stop or remove
# containers, read images, volumes or networks, or reach Corral's own containers.
global
    log stdout format raw local0 notice

defaults
    mode http
    log global
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    # A session's exec stream carries the inner SSH session's keepalives every minute.
    timeout tunnel 1h

frontend docker
    bind :2375
    acl exec_create path,url_dec -m reg ^(/v[0-9.]+)?/containers/corral-([a-z][a-z0-9-]*-[0-9a-f]{6}|sbx-[0-9a-f]{12})/exec$
    acl exec_use path,url_dec -m reg ^(/v[0-9.]+)?/exec/[0-9a-f]{64}/(start|resize)$
    acl exec_inspect path,url_dec -m reg ^(/v[0-9.]+)?/exec/[0-9a-f]{64}/json$
    acl version path,url_dec -m reg ^(/v[0-9.]+)?/(_ping|version)$
    http-request allow if METH_POST exec_create
    http-request allow if METH_POST exec_use
    http-request allow if METH_GET exec_inspect
    http-request allow if METH_GET version
    http-request deny
    default_backend dockerd

backend dockerd
    server dockerd /var/run/docker.sock
