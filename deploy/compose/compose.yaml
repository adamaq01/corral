name: corral

services:
  corral:
    image: ghcr.io/adamaq01/corral:${CORRAL_VERSION:-latest}
    restart: unless-stopped
    # The Docker socket's owner and group differ between hosts; root can open it on all of them.
    user: root
    env_file: .env
    volumes:
      - ./config.toml:/etc/corral/config.toml:ro
      - corral-data:/var/lib/corral
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - corral
    healthcheck:
      test: ["CMD", "corral-server", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3

  containerssh:
    # https://github.com/adamaq01/ContainerSSH: ContainerSSH's main branch with two fixes not yet
    # released upstream, for one-shot commands losing output and for stray bytes in Kubernetes
    # terminals.
    image: ghcr.io/adamaq01/containerssh:7d65536@sha256:c53d09697e5605b7515606e7bb4c1284abc4c53eadd6e89b327166f344859c8f
    restart: unless-stopped
    volumes:
      - ./containerssh.yaml:/etc/containerssh/config.yaml:ro
      - ./containerssh_host_key:/etc/containerssh/host_key:ro
      - ./containerssh_proxy_key:/etc/containerssh/proxy_key:ro
    ports:
      - "48291:2222"
    networks:
      - corral
      - corral-sandboxes
    healthcheck:
      test: ["CMD", "/containerssh", "--config", "/etc/containerssh/config.yaml", "--healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3

networks:
  corral: {}
  # Sandboxes join this network. Corral must never be on it: its internal listener is
  # unauthenticated and wakes any sandbox it is asked about.
  corral-sandboxes:
    name: corral-sandboxes

volumes:
  corral-data: {}
