name: corral

services:
  corral:
    image: ghcr.io/adamaq01/corral:${CORRAL_VERSION:-latest}
    restart: unless-stopped
    # The Docker socket's owner and group differ between hosts; root can open it on all of them.
    user: root
    env_file: .env
    volumes:
      - ./config.toml:/etc/corral/config.toml:ro
      - corral-data:/var/lib/corral
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - corral
    healthcheck:
      test: ["CMD", "corral-server", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3

  # The SSH front door: the same image, which reaches Corral's internal listener and opens each
  # session in its sandbox with `docker exec`.
  gate:
    image: ghcr.io/adamaq01/corral:${CORRAL_VERSION:-latest}
    restart: unless-stopped
    command: [gate]
    user: root
    environment:
      CORRAL_GATE_SECRET: ${CORRAL_GATE_SECRET:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config.toml:/etc/corral/config.toml:ro
      - ./ssh_host_key:/etc/corral/ssh_host_key:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "48291:2222"
    networks:
      - corral
    healthcheck:
      test: ["CMD", "corral-server", "healthcheck", "--gate"]
      interval: 5s
      timeout: 10s
      retries: 3

networks:
  corral: {}

volumes:
  corral-data: {}
