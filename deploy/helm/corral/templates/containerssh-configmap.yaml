{{- $webhook := printf "http://%s:8081" (include "corral.webhooksName" .) }}
{{- $config := dict
  "ssh" (dict "hostkeys" (list "/etc/containerssh/keys/host_key"))
  "auth" (dict
    "password" (dict "method" "")
    "keyboardInteractive" (dict "method" "")
    "publicKey" (dict "method" "webhook" "webhook" (dict "url" $webhook)))
  "configserver" (dict
    "url" (printf "%s/config" $webhook)
    "timeout" (printf "%ds" (add .Values.ssh.wakeDeadlineSecs 10)))
  "backend" "kubernetes"
  "kubernetes" (dict
    "connection" (dict
      "host" "kubernetes.default.svc"
      "cacertFile" "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      "bearerTokenFile" "/var/run/secrets/kubernetes.io/serviceaccount/token")
    "pod" (dict "agentPath" "/opt/containerssh-agent/usr/bin/containerssh-agent"))
  "security" (dict "forwarding" (dict "forwardingMode" "enable"))
  "health" (dict "enable" true "listen" "127.0.0.1:7000") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "corral.containersshName" . }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: containerssh
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
