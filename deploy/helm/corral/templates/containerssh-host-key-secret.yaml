{{- if not .Values.containerssh.hostKey.existingSecret }}
{{- $name := include "corral.hostKeySecret" . }}
{{- $kept := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: containerssh
  annotations:
    # A new host key would break every client's known_hosts entry.
    helm.sh/resource-policy: keep
type: Opaque
data:
  host_key: {{ $kept.host_key | default (genPrivateKey "ed25519" | b64enc) }}
{{- end }}
