{{- if not .Values.keys.existingSecret }}
{{- $name := include "corral.keysSecret" . }}
{{- $kept := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # New keys would make every stored credential unreadable.
    {{- include "corral.keep" . | nindent 4 }}
type: Opaque
data:
  CORRAL_SESSION_KEY: {{ $kept.CORRAL_SESSION_KEY | default (randBytes 64 | b64enc) }}
  CORRAL_SECRETS_KEY: {{ $kept.CORRAL_SECRETS_KEY | default (printf "1:%s" (randBytes 32) | b64enc) }}
{{- end }}
