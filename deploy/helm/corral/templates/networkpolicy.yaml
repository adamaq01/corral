{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "corral.fullname" . }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "corral.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              {{- include "corral.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: containerssh
      ports:
        - port: internal
{{- end }}
