apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "corral.fullname" . }}
  namespace: {{ include "corral.sandboxNamespace" . }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, deletecollection]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Admins see the recent events of a sandbox's objects in the web UI.
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
