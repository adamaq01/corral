{{- if not .Values.ssh.hostKey.existingSecret }}
{{- $name := include "corral.hostKeySecret" . }}
{{- $kept := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* The key ContainerSSH served under its former name, so the fingerprint people trust stays. */}}
{{- $former := (lookup "v1" "Secret" .Release.Namespace (printf "%s-containerssh-host-key" (include "corral.fullname" .))).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: gate
  annotations:
    # A new host key would break every client's known_hosts entry.
    {{- include "corral.keep" . | nindent 4 }}
type: Opaque
data:
  host_key: {{ $kept.host_key | default $former.host_key | default (genPrivateKey "ed25519" | b64enc) }}
{{- end }}
