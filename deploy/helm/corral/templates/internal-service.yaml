{{- /* Always ClusterIP: the internal API wakes any sandbox the gate asks about. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "corral.internalName" . }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "corral.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: internal
      port: 8081
      targetPort: internal
