apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "corral.containersshName" . }}
  namespace: {{ include "corral.sandboxNamespace" . }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: containerssh
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
