{{- $fullname := include "corral.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "corral.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # One server owns the idle sweep, and SQLite lives on a ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "corral.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "corral.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: corral
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- range list "CORRAL_SESSION_KEY" "CORRAL_SECRETS_KEY" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "corral.keysSecret" $ }}
                  key: {{ . }}
            {{- end }}
            {{- range include "corral.secretEnv" . | fromJsonArray }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .ref.existingSecret | default $fullname }}
                  key: {{ .ref.key | default .name }}
            {{- end }}
            {{- if eq .Values.database.kind "cnpg" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-db-app
                  key: uri
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/corral
              readOnly: true
            {{- if eq .Values.database.kind "sqlite" }}
            - name: data
              mountPath: /var/lib/corral
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
        {{- if eq .Values.database.kind "sqlite" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.database.sqlite.existingClaim | default (printf "%s-data" $fullname) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
