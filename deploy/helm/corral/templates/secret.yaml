{{- $values := dict }}
{{- range include "corral.secretEnv" . | fromJsonArray }}
{{- if .ref.value }}
{{- $_ := set $values .name .ref.value }}
{{- end }}
{{- end }}
{{- with $values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corral.fullname" $ }}
  labels:
    {{- include "corral.labels" $ | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
