# Values for the Corral chart. values.schema.json validates every key: an unknown or misspelled
# key fails `helm install`.

# baseUrl is the address people open in a browser, http:// or https://. Required. The Ingress and
# HTTPRoute serve its host name. The session cookie is marked Secure exactly when it is https.
# baseUrl: https://corral.example.com

# trustForwardedFor makes password-login limits count each client by X-Forwarded-For. Turn it on
# behind an Ingress controller or Gateway, where every peer is the proxy.
trustForwardedFor: false

# logLevel sets RUST_LOG for the server, such as info, debug or corral_api=debug.
logLevel: info

# nameOverride replaces the chart name in resource names.
nameOverride: ""
# fullnameOverride replaces the release-and-chart name that prefixes every resource.
fullnameOverride: ""

image:
  # image.repository is the Corral server image.
  repository: ghcr.io/adamaq01/corral
  # image.tag defaults to the chart's appVersion.
  tag: ""
  # image.pullPolicy is the server container's pull policy.
  pullPolicy: IfNotPresent

# imagePullSecrets are the Secrets for pulling the Corral image, which the server and the gate
# run.
imagePullSecrets: []

ssh:
  # ssh.publicHost is the host name people pass to ssh. Required.
  # publicHost: ssh.example.com
  # ssh.publicPort is the port people pass to ssh, and the gate Service's port.
  publicPort: 48291
  # ssh.wakeDeadlineSecs is how long Corral waits for a sleeping sandbox to wake before it tells
  # the gate it still wakes; the gate asks again, for up to 5 minutes.
  wakeDeadlineSecs: 20
  # ssh.hostKey.existingSecret names a Secret whose `host_key` is the SSH host private key, in
  # OpenSSH or PEM form. Empty: `helm install` generates an ed25519 key once, keeps it across
  # upgrades, and `helm uninstall` leaves it behind, so known_hosts entries stay valid. Required
  # where the chart is rendered without a cluster, as by helm template or Argo CD.
  hostKey:
    existingSecret: ""
  # ssh.lockoutExemptNetworks are networks, in CIDR notation, whose SSH connections are never
  # locked out by address, because every client behind them shares it: the pods of a tunnel such
  # as rathole, or a proxy. See "Lockout behind a tunnel" in the README.
  lockoutExemptNetworks: []

identity:
  local:
    # identity.local.enabled turns on local accounts, created with
    # `kubectl exec deploy/<release> -- corral-server local-account create <name> --admin`.
    enabled: true
  oidc:
    # identity.oidc.enabled turns on OIDC login. Register <baseUrl>/auth/oidc/callback as the
    # redirect URI.
    enabled: false
    # identity.oidc.issuer is the issuer URL, as in its discovery document.
    issuer: ""
    # identity.oidc.clientId is Corral's client id at the issuer.
    clientId: ""
    # identity.oidc.scopes are the scopes requested at login.
    scopes: [openid, profile, email, groups]
    # identity.oidc.memberGroup is the group whose members log in as members.
    memberGroup: corral-users
    # identity.oidc.adminGroup is the group whose members log in as admins.
    adminGroup: corral-admins
    # identity.oidc.clientSecret is the client secret: either `existingSecret` and `key`, naming
    # a Secret in the release namespace, or `value`, which the chart stores in a Secret.
    clientSecret: {}
    opkssh:
      # identity.oidc.opkssh.enabled lets OIDC users who run `opkssh login` reach SSH without
      # registering a key. It needs a public client at the issuer for opkssh, with PKCE.
      enabled: false
      # identity.oidc.opkssh.clientId is the issuer's client that `opkssh login` uses.
      clientId: opkssh
      # identity.oidc.opkssh.policy is how long a certificate lasts: 12h, 24h, 48h or 1week.
      policy: 24h

# keys.existingSecret names a Secret with CORRAL_SESSION_KEY, CORRAL_SECRETS_KEY and
# CORRAL_GATE_SECRET, as printed by `corral-server keys generate`. Empty: `helm install` generates
# them once and keeps them across upgrades, and `helm uninstall` leaves that Secret behind, since
# stored secrets need it.
# Required where the chart is rendered without a cluster, as by helm template or Argo CD.
keys:
  existingSecret: ""

secretStore:
  # secretStore.kind is where users' secret values are kept: database (encrypted with
  # CORRAL_SECRETS_KEY) or vault (a Vault or OpenBao KV v2 mount).
  kind: database
  vault:
    # secretStore.vault.address is the Vault or OpenBao URL.
    address: ""
    # secretStore.vault.mount is the KV v2 mount.
    mount: secret
    # secretStore.vault.pathPrefix is the path under the mount that holds Corral's secrets.
    pathPrefix: corral
    auth:
      # secretStore.vault.auth.kind is kubernetes (Corral's ServiceAccount token, which the
      # role must bind) or token.
      kind: kubernetes
      # secretStore.vault.auth.role is the Kubernetes auth role, for kind kubernetes.
      role: ""
      # secretStore.vault.auth.token is the Vault token, for kind token: `existingSecret` and
      # `key`, or `value`.
      token: {}

database:
  # database.kind is sqlite (a file on a PersistentVolumeClaim), postgres (any server, by URL) or
  # cnpg (a CloudNativePG Cluster this chart creates; the CNPG operator must be installed).
  kind: sqlite
  sqlite:
    # database.sqlite.size is the size of the volume that holds the database file.
    size: 1Gi
    # database.sqlite.storageClass is the volume's StorageClass. Empty: the cluster default.
    storageClass: ""
    # database.sqlite.existingClaim mounts this PersistentVolumeClaim instead of creating one.
    existingClaim: ""
  postgres:
    # database.postgres.url is the postgres:// URL: `existingSecret` and `key`, or `value`.
    url: {}
  cnpg:
    # database.cnpg.instances is the number of Postgres instances.
    instances: 1
    # database.cnpg.size is each instance's volume size.
    size: 1Gi
    # database.cnpg.storageClass is the instances' StorageClass. Empty: the cluster default.
    storageClass: ""
    # database.cnpg.enablePDB keeps the operator's PodDisruptionBudgets, which stop a node drain
    # from evicting the primary. With one instance that blocks draining its node; false removes
    # them. Needs CloudNativePG 1.23 or later to turn off.
    enablePDB: true

sandboxes:
  namespace:
    # sandboxes.namespace.name is the namespace of the sandboxes. Empty: <fullname>-sandboxes.
    # Corral and the gate get rights in this namespace only.
    name: ""
    # sandboxes.namespace.create creates the namespace. With false it must exist.
    create: true
  # sandboxes.storageClass is the StorageClass of sandbox homes. Empty: the cluster default.
  storageClass: ""
  # sandboxes.overlayImage is the Corral overlay, mounted into every sandbox at /opt/corral: the
  # sandbox user, sudo, the login shell, OpenSSH, Herdr and the corral command, for any image.
  overlayImage:
    # sandboxes.overlayImage.repository is the overlay image.
    repository: ghcr.io/adamaq01/corral-overlay
    # sandboxes.overlayImage.tag defaults to the chart's appVersion.
    tag: ""
  # sandboxes.imagePullSecrets are Secrets in the sandbox namespace, each as name, that sandbox
  # pods pull their image and the overlay with.
  imagePullSecrets: []

# keepOnUninstall keeps the database volume or CNPG Cluster and the chart-created sandbox
# namespace, with every sandbox and home in it, when the release is uninstalled or its Argo CD
# Application deleted.
keepOnUninstall: false

idle:
  # idle.timeoutSecs is how long a sandbox stays awake with no work, unless its owner chose
  # another timeout. Work is input through SSH (keystrokes, commands, file transfers, forwarded
  # traffic) or the sandbox's own processor or network use.
  timeoutSecs: 1800
  # idle.maxTimeoutSecs is the longest idle timeout an owner may choose for a sandbox.
  maxTimeoutSecs: 86400
  # idle.maxKeepAwakeSecs is how far ahead an owner may keep a sandbox awake, work or not.
  maxKeepAwakeSecs: 604800
  # idle.checkIntervalSecs is how often running sandboxes are checked.
  checkIntervalSecs: 60
  # idle.reportIntervalSecs is how often each sandbox reports its processor and network use.
  reportIntervalSecs: 60
  # A report interval is work when the sandbox used idle.busyCpuPercent of one core on average,
  # or moved idle.busyNetworkBytesPerSec bytes a second in and out.
  busyCpuPercent: 2
  busyNetworkBytesPerSec: 4096

limits:
  # limits.maxSandboxesPerUser is how many sandboxes each user may have.
  maxSandboxesPerUser: 5
  # limits.maxRunning is how many sandboxes may be awake at once, across all users.
  maxRunning: 6

catalog:
  # catalog.images are the images users pick from; the first is the default. Empty: the
  # corral-sandbox image. Each has key, label and reference.
  images: []
  # catalog.sizes are the sizes users pick from; the first is the default. Empty: one size of
  # 2 CPUs, 4 GiB and a 10 GiB home. Each has key, label, cpuRequest, cpuLimit, memoryRequest,
  # memoryLimit and homeSize.
  sizes: []
  namedImages:
    # catalog.namedImages.enabled lets users name an image of their own beside the catalog's.
    enabled: false
    # catalog.namedImages.registries are where a named image must come from: registries, such as
    # ghcr.io, or repository paths in one, such as ghcr.io/acme.
    registries: []
    # catalog.namedImages.maxSize is the most a named image may take to download, its layers
    # compressed.
    maxSize: 5Gi

# registries are the registries Corral reads named images' sizes from. Each has registry (its
# host, with its port if any), and for a private one username and password, a secret value as
# below; plainHttp reads it over plain HTTP. Users never see the credentials. Nodes pull with
# sandboxes.imagePullSecrets.
registries: []

serviceAccount:
  # serviceAccount.annotations are added to Corral's ServiceAccount.
  annotations: {}

service:
  # service.type is the web UI and API Service's type.
  type: ClusterIP
  # service.port is the web UI and API Service's port.
  port: 8080
  # service.annotations are added to the Service.
  annotations: {}

ingress:
  # ingress.enabled serves baseUrl's host through an Ingress.
  enabled: false
  # ingress.className is the IngressClass. Empty: the cluster default.
  className: ""
  # ingress.annotations are added to the Ingress.
  annotations: {}
  # ingress.tlsSecretName is the TLS certificate's Secret. Empty: no TLS section.
  tlsSecretName: ""

httpRoute:
  # httpRoute.enabled serves baseUrl's host through a Gateway API HTTPRoute.
  enabled: false
  # httpRoute.parentRefs are the Gateways the route attaches to.
  parentRefs: []
  # httpRoute.annotations are added to the HTTPRoute.
  annotations: {}

# networkPolicy.enabled lets only the gate reach Corral's internal port, which wakes any sandbox
# it is asked about for the shared secret. It needs a network plugin that enforces NetworkPolicy.
networkPolicy:
  enabled: true

# resources are the Corral container's requests and limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
# podAnnotations are added to the Corral pod.
podAnnotations: {}
# nodeSelector constrains the Corral pod's nodes.
nodeSelector: {}
# tolerations are the Corral pod's tolerations.
tolerations: []
# affinity is the Corral pod's affinity.
affinity: {}

gate:
  # gate.replicas is the number of gate pods, the SSH front door. Each holds no state, so any
  # number serve the same host key.
  replicas: 1
  service:
    # gate.service.type is LoadBalancer, NodePort or ClusterIP.
    type: LoadBalancer
    # gate.service.port is the Service port. Empty: ssh.publicPort.
    port: null
    # gate.service.nodePort fixes the node port, for type NodePort or LoadBalancer.
    nodePort: null
    # gate.service.externalTrafficPolicy is Local, so Corral sees each client's address and
    # failed-login lockouts count per client, or Cluster. NodePort and LoadBalancer only.
    externalTrafficPolicy: Local
    # gate.service.loadBalancerClass selects a load balancer implementation.
    loadBalancerClass: ""
    # gate.service.annotations are added to the Service, such as metallb.io/loadBalancerIPs.
    annotations: {}
  # gate.resources are the gate container's requests and limits.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # gate.podAnnotations are added to the gate pods.
  podAnnotations: {}
  # gate.nodeSelector constrains the gate pods' nodes.
  nodeSelector: {}
  # gate.tolerations are the gate pods' tolerations.
  tolerations: []
  # gate.affinity is the gate pods' affinity.
  affinity: {}
