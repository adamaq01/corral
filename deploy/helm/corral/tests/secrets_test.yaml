suite: generated and referenced secrets
release:
  name: corral
  namespace: corral
values:
  - ../../examples/minimal.yaml
# Rendered as helm install renders it: against a cluster, with agent-sandbox installed.
capabilities:
  apiVersions: [agents.x-k8s.io/v1beta1]
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr: { version: v1, resource: namespaces }
      namespaced: false
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata: { name: kube-system }
tests:
  - it: generates the session and secrets keys and the gate secret in the format corral-server keys generate prints
    template: templates/keys-secret.yaml
    asserts:
      - matchRegex:
          path: data.CORRAL_SESSION_KEY
          pattern: '^[A-Za-z0-9+/=]{100,}$'
      - matchRegex:
          path: data.CORRAL_GATE_SECRET
          pattern: '^[A-Za-z0-9+/=]{60}$'

  - it: keeps the generated Secrets through helm uninstall and Argo CD, whatever keepOnUninstall says
    templates:
      - templates/keys-secret.yaml
      - templates/ssh-host-key-secret.yaml
    set:
      keepOnUninstall: false
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
            argocd.argoproj.io/sync-options: Delete=false,Prune=false

  - it: keeps the keys already in the cluster on upgrade
    template: templates/keys-secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: { name: corral-keys, namespace: corral }
          data: { CORRAL_SESSION_KEY: c2Vzc2lvbg==, CORRAL_SECRETS_KEY: MTpzZWNyZXRz, CORRAL_GATE_SECRET: Z2F0ZQ== }
    asserts:
      - equal:
          path: data
          value: { CORRAL_SESSION_KEY: c2Vzc2lvbg==, CORRAL_SECRETS_KEY: MTpzZWNyZXRz, CORRAL_GATE_SECRET: Z2F0ZQ== }

  - it: adds a gate secret to keys made before the gate, keeping the others
    template: templates/keys-secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: { name: corral-keys, namespace: corral }
          data: { CORRAL_SESSION_KEY: c2Vzc2lvbg==, CORRAL_SECRETS_KEY: MTpzZWNyZXRz }
    asserts:
      - equal:
          path: data.CORRAL_SESSION_KEY
          value: c2Vzc2lvbg==
      - matchRegex:
          path: data.CORRAL_GATE_SECRET
          pattern: '^[A-Za-z0-9+/=]{60}$'

  - it: keeps the host key already in the cluster on upgrade
    template: templates/ssh-host-key-secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: { name: corral-ssh-host-key, namespace: corral }
          data: { host_key: a2VwdA== }
        - apiVersion: v1
          kind: Secret
          metadata: { name: corral-containerssh-host-key, namespace: corral }
          data: { host_key: Zm9ybWVy }
    asserts:
      - equal:
          path: metadata.name
          value: corral-ssh-host-key
      - equal:
          path: data.host_key
          value: a2VwdA==

  - it: takes the host key ContainerSSH served, so its fingerprint stays
    template: templates/ssh-host-key-secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: { name: corral-containerssh-host-key, namespace: corral }
          data: { host_key: Zm9ybWVy }
    asserts:
      - equal:
          path: data.host_key
          value: Zm9ybWVy

  - it: generates no keys Secret when one is named, and Corral reads that one
    templates:
      - templates/keys-secret.yaml
      - templates/deployment.yaml
    set:
      keys.existingSecret: my-keys
    asserts:
      - hasDocuments:
          count: 0
        template: templates/keys-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_SECRETS_KEY
            valueFrom: { secretKeyRef: { name: my-keys, key: CORRAL_SECRETS_KEY } }
        template: templates/deployment.yaml

  - it: reads an existing Secret for the OIDC client secret and stores none itself
    templates:
      - templates/secret.yaml
      - templates/deployment.yaml
    set:
      identity.oidc:
        enabled: true
        issuer: https://auth.example.com
        clientId: corral
        clientSecret: { existingSecret: corral-oidc, key: client-secret }
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_OIDC_CLIENT_SECRET
            valueFrom: { secretKeyRef: { name: corral-oidc, key: client-secret } }
        template: templates/deployment.yaml

  - it: stores plain values in its own Secret and points Corral at it
    templates:
      - templates/secret.yaml
      - templates/deployment.yaml
    set:
      database:
        kind: postgres
        postgres: { url: { value: "postgres://corral:pw@db:5432/corral" } }
      secretStore:
        kind: vault
        vault:
          address: http://openbao:8200
          auth: { kind: token, token: { value: hvs.token } }
    asserts:
      - equal:
          path: stringData
          value:
            CORRAL_VAULT_TOKEN: hvs.token
            DATABASE_URL: "postgres://corral:pw@db:5432/corral"
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: { secretKeyRef: { name: corral, key: DATABASE_URL } }
        template: templates/deployment.yaml

  - it: hands Corral each registry password from its Secret, or from its own for a plain value
    templates:
      - templates/secret.yaml
      - templates/deployment.yaml
    set:
      registries:
        - registry: ghcr.io
          username: corral
          password: { existingSecret: ghcr, key: token }
        - registry: registry.lan:5000
        - registry: quay.io
          username: robot
          password: { value: quay-token }
    asserts:
      - equal:
          path: stringData
          value:
            CORRAL_REGISTRY_2_PASSWORD: quay-token
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_REGISTRY_0_PASSWORD
            valueFrom: { secretKeyRef: { name: ghcr, key: token } }
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_REGISTRY_2_PASSWORD
            valueFrom: { secretKeyRef: { name: corral, key: CORRAL_REGISTRY_2_PASSWORD } }
        template: templates/deployment.yaml

  - it: hands Corral each password variable the registries added in Settings name
    templates:
      - templates/secret.yaml
      - templates/deployment.yaml
    set:
      registryPasswords:
        CORRAL_GHCR_TOKEN: { existingSecret: ghcr, key: token }
        CORRAL_QUAY_TOKEN: { value: quay-token }
    asserts:
      - equal:
          path: stringData
          value:
            CORRAL_QUAY_TOKEN: quay-token
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_GHCR_TOKEN
            valueFrom: { secretKeyRef: { name: ghcr, key: token } }
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_QUAY_TOKEN
            valueFrom: { secretKeyRef: { name: corral, key: CORRAL_QUAY_TOKEN } }
        template: templates/deployment.yaml
