suite: Corral's config file
templates:
  - templates/configmap.yaml
release:
  name: corral
  namespace: corral
values:
  - ../../examples/minimal.yaml
# Rendered as helm install renders it: against a cluster, with agent-sandbox installed.
capabilities:
  apiVersions: [agents.x-k8s.io/v1beta1]
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr: { version: v1, resource: namespaces }
      namespaced: false
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata: { name: kube-system }
tests:
  - it: runs the agent-sandbox engine in the sandbox namespace, on the cluster's default storage class
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[engine\]\s+kind = "agent-sandbox"\s+namespace = "corral-sandboxes"\s+overlay_image = "ghcr.io/adamaq01/corral-overlay:latest"\s+service_account = "corral-sandbox"\s+\['
      - notMatchRegex:
          path: data["config.toml"]
          pattern: storage_class
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[identity\.local\]'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'oidc|catalog'

  - it: gives sandboxes the API at the in-cluster Service, and people the base URL
    set:
      service.port: 8090
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[http\]\s+base_url = "http://corral\.example\.lan:8080"\s+sandbox_base_url = "http://corral\.corral\.svc:8090"'

  - it: names the storage class and namespace it is given
    set:
      sandboxes.storageClass: fast-nvme
      sandboxes.namespace.name: homes
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'namespace = "homes"\s+overlay_image = "[^"]+"\s+service_account = "corral-sandbox"\s+storage_class = "fast-nvme"'

  - it: mounts the overlay of the chart's appVersion unless told otherwise
    chart:
      appVersion: sha-0123abc
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'overlay_image = "ghcr.io/adamaq01/corral-overlay:sha-0123abc"'

  - it: mounts the overlay image it is given
    set:
      sandboxes.overlayImage:
        repository: registry.example.lan/corral-overlay
        tag: v1
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'overlay_image = "registry.example.lan/corral-overlay:v1"'

  - it: maps OIDC values to the [identity.oidc] keys, without local accounts when they are off
    set:
      identity.local.enabled: false
      identity.oidc:
        enabled: true
        issuer: https://auth.example.com
        clientId: corral
        clientSecret: { value: s3cret }
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[identity\.oidc\]\s+admin_group = "corral-admins"\s+client_id = "corral"\s+issuer = "https://auth.example.com"\s+member_group = "corral-users"\s+scopes = \["openid", "profile", "email", "groups"\]'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'identity\.local|s3cret'

  - it: maps opkssh logins to [identity.oidc.opkssh] only when OIDC and opkssh are both on
    set:
      identity.oidc:
        enabled: true
        issuer: https://auth.example.com/oidc
        clientId: corral
        clientSecret: { value: s3cret }
        opkssh: { enabled: true, policy: 12h }
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[identity\.oidc\.opkssh\]\s+client_id = "opkssh"\s+policy = "12h"'

  - it: leaves opkssh out when it is off
    set:
      identity.oidc:
        enabled: true
        issuer: https://auth.example.com/oidc
        clientId: corral
        clientSecret: { value: s3cret }
    asserts:
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'opkssh'

  - it: maps the Vault store with Kubernetes auth
    set:
      secretStore:
        kind: vault
        vault:
          address: http://openbao:8200
          auth: { kind: kubernetes, role: corral }
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[secrets\]\s+address = "http://openbao:8200"\s+kind = "vault"\s+mount = "secret"\s+path_prefix = "corral"\s+\[secrets\.auth\]\s+kind = "kubernetes"\s+role = "corral"'

  - it: leaves the token out of the config with Vault token auth
    set:
      secretStore:
        kind: vault
        vault:
          address: http://openbao:8200
          auth: { kind: token, token: { value: hvs.token } }
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[secrets\.auth\]\s+kind = "token"\s*(\[|$)'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'hvs\.token|role'

  - it: writes catalog sizes with the server's key names and integers for every count
    set:
      idle.timeoutSecs: 600
      limits.maxRunning: 10
      catalog.sizes:
        - key: big
          label: Big
          cpuRequest: "1"
          cpuLimit: "4"
          memoryRequest: 2Gi
          memoryLimit: 8Gi
          homeSize: 30Gi
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[\[catalog\.sizes\]\]\s+cpu_limit = "4"\s+cpu_request = "1"\s+home_size = "30Gi"\s+key = "big"\s+label = "Big"\s+memory_limit = "8Gi"\s+memory_request = "2Gi"'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'timeout_secs = 600\n'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'max_running = 10\n'

  - it: leaves both limits to Settings when the values set neither
    asserts:
      - notMatchRegex:
          path: data["config.toml"]
          pattern: '\[limits\]'

  - it: locks only the limits the values set
    set:
      limits.maxRunning: 3
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[limits\]\s+max_running = 3\n'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: max_sandboxes_per_member

  - it: writes the limit per member with the server's key name
    set:
      limits: { maxSandboxesPerMember: 2, maxRunning: 4 }
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[limits\]\s+max_running = 4\s+max_sandboxes_per_member = 2\n'

  - it: runs the gate on its port with the host key it mounts, asking Corral at the internal Service
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[frontdoor\]\s+host_key_file = "/etc/corral-gate/host_key"\s+kind = "gate"\s+listen_addr = "0\.0\.0\.0:2222"\s+server_url = "http://corral-internal:8081"\s+\['

  - it: locks out every network by default
    asserts:
      - notMatchRegex:
          path: data["config.toml"]
          pattern: lockout_exempt_networks

  - it: maps lockout-exempt networks to the [frontdoor] section
    set:
      ssh.lockoutExemptNetworks: [10.42.0.0/16, fd00:42::/48]
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'listen_addr = "0\.0\.0\.0:2222"\s+lockout_exempt_networks = \["10\.42\.0\.0/16", "fd00:42::/48"\]\n'

  - it: writes an image's description, an entry's enabled flag and the defaults when they are set
    set:
      catalog:
        images:
          - key: tools
            label: Tools
            reference: ghcr.io/acme/tools:1
            description: Node and Python
          - key: legacy
            label: Legacy
            reference: ghcr.io/acme/legacy:1
            enabled: false
        sizes:
          - key: small
            label: Small
            cpuRequest: 500m
            cpuLimit: "2"
            memoryRequest: 1Gi
            memoryLimit: 4Gi
            homeSize: 10Gi
            enabled: false
        defaults: { image: tools, size: small }
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[catalog\]\s+default_image = "tools"\s+default_size = "small"\s+\[\[catalog\.images\]\]\s+description = "Node and Python"\s+key = "tools"\s+label = "Tools"\s+reference = "ghcr\.io/acme/tools:1"\s+\[\[catalog\.images\]\]\s+enabled = false\s+key = "legacy"'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[\[catalog\.sizes\]\]\s+cpu_limit = "2"\s+cpu_request = "500m"\s+enabled = false\s+home_size'

  - it: leaves an entry's description and enabled flag and the defaults out when they are not set
    set:
      catalog:
        images:
          - key: tools
            label: Tools
            reference: ghcr.io/acme/tools:1
        sizes:
          - key: small
            label: Small
            cpuRequest: 500m
            cpuLimit: "2"
            memoryRequest: 1Gi
            memoryLimit: 4Gi
            homeSize: 10Gi
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[\[catalog\.images\]\]\s+key = "tools"'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'description|enabled|default_image|default_size'

  - it: lets users name images from the registries it lists, up to the size it caps them at
    set:
      catalog.namedImages:
        enabled: true
        registries: [ghcr.io/acme, docker.io]
        maxSize: 2Gi
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[catalog\.named_images\]\s+max_size = "2Gi"\s+registries = \["ghcr\.io/acme", "docker\.io"\]'

  - it: pulls sandbox images with the Secrets it names, and reads registries with the logins it is given
    set:
      sandboxes.imagePullSecrets: [{ name: regcred }]
      registries:
        - registry: ghcr.io
          username: corral
          password: { existingSecret: ghcr, key: token }
        - registry: registry.lan:5000
          plainHttp: true
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'image_pull_secrets = \["regcred"\]'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[\[registries\]\]\s+password_env = "CORRAL_REGISTRY_0_PASSWORD"\s+plain_http = false\s+registry = "ghcr\.io"\s+username = "corral"\s+\[\[registries\]\]\s+plain_http = true\s+registry = "registry\.lan:5000"'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: 'token|ghcr"'
