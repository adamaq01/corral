suite: database and what outlives helm uninstall
release:
  name: corral
  namespace: corral
values:
  - ../../examples/minimal.yaml
# Rendered as helm install renders it: against a cluster, with agent-sandbox installed.
capabilities:
  apiVersions: [agents.x-k8s.io/v1beta1]
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr: { version: v1, resource: namespaces }
      namespaced: false
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata: { name: kube-system }
tests:
  - it: puts SQLite on a volume at the server's default path, deleted on uninstall by default
    templates:
      - templates/data-pvc.yaml
      - templates/deployment.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        template: templates/data-pvc.yaml
      - notExists:
          path: metadata.annotations
        template: templates/data-pvc.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: data, mountPath: /var/lib/corral }
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: DATABASE_URL }
          any: true
        template: templates/deployment.yaml

  - it: mounts an existing claim instead of creating one
    templates:
      - templates/data-pvc.yaml
      - templates/deployment.yaml
    set:
      database.sqlite.existingClaim: old-data
    asserts:
      - hasDocuments:
          count: 0
        template: templates/data-pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content: { name: data, persistentVolumeClaim: { claimName: old-data } }
        template: templates/deployment.yaml

  - it: creates a CNPG Cluster and reads its app URI
    templates:
      - templates/cnpg-cluster.yaml
      - templates/data-pvc.yaml
      - templates/deployment.yaml
    set:
      database.kind: cnpg
    asserts:
      - equal:
          path: spec.bootstrap.initdb
          value: { database: corral, owner: corral }
        template: templates/cnpg-cluster.yaml
      - hasDocuments:
          count: 0
        template: templates/data-pvc.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: { secretKeyRef: { name: corral-db-app, key: uri } }
        template: templates/deployment.yaml

  - it: leaves the CNPG operator's PodDisruptionBudgets on by default
    template: templates/cnpg-cluster.yaml
    set:
      database.kind: cnpg
    asserts:
      - notExists:
          path: spec.enablePDB

  - it: turns the CNPG PodDisruptionBudgets off, so a single instance does not block a node drain
    template: templates/cnpg-cluster.yaml
    set:
      database.kind: cnpg
      database.cnpg.enablePDB: false
    asserts:
      - equal:
          path: spec.enablePDB
          value: false

  - it: keeps the data volume and the sandbox namespace through helm uninstall and Argo CD with keepOnUninstall
    templates:
      - templates/data-pvc.yaml
      - templates/sandbox-namespace.yaml
    set:
      keepOnUninstall: true
    asserts:
      - equal:
          path: metadata.annotations
          value: &kept
            helm.sh/resource-policy: keep
            argocd.argoproj.io/sync-options: Delete=false,Prune=false
        template: templates/data-pvc.yaml
      - equal:
          path: metadata.annotations
          value: *kept
        template: templates/sandbox-namespace.yaml

  - it: keeps the CNPG Cluster through helm uninstall and Argo CD with keepOnUninstall
    template: templates/cnpg-cluster.yaml
    set:
      keepOnUninstall: true
      database.kind: cnpg
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
            argocd.argoproj.io/sync-options: Delete=false,Prune=false

  - it: lets helm uninstall and Argo CD delete the CNPG Cluster and the sandbox namespace by default
    templates:
      - templates/cnpg-cluster.yaml
      - templates/sandbox-namespace.yaml
    set:
      database.kind: cnpg
    asserts:
      - notExists:
          path: metadata.annotations
