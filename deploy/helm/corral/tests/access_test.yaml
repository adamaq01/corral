suite: rights in the sandbox namespace and the SSH front door
release:
  name: corral
  namespace: corral
values:
  - ../../examples/minimal.yaml
# Rendered as helm install renders it: against a cluster, with agent-sandbox installed.
capabilities:
  apiVersions: [agents.x-k8s.io/v1beta1]
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr: { version: v1, resource: namespaces }
      namespaced: false
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata: { name: kube-system }
tests:
  - it: grants Corral and the gate Roles in the sandbox namespace only, never cluster-wide
    templates:
      - templates/role.yaml
      - templates/gate-role.yaml
      - templates/rolebinding.yaml
      - templates/gate-rolebinding.yaml
    asserts:
      - isKind:
          of: Role
        template: templates/role.yaml
      - equal:
          path: metadata.namespace
          value: corral-sandboxes
      - equal:
          path: rules
          value:
            - { apiGroups: [""], resources: [pods/exec], verbs: [get, create] }
        template: templates/gate-role.yaml
      - equal:
          path: subjects
          value: [{ kind: ServiceAccount, name: corral-gate, namespace: corral }]
        template: templates/gate-rolebinding.yaml
      - equal:
          path: subjects
          value: [{ kind: ServiceAccount, name: corral, namespace: corral }]
        template: templates/rolebinding.yaml

  - it: uses an existing sandbox namespace without creating it
    templates:
      - templates/sandbox-namespace.yaml
      - templates/role.yaml
    set:
      sandboxes.namespace: { name: homes, create: false }
    asserts:
      - hasDocuments:
          count: 0
        template: templates/sandbox-namespace.yaml
      - equal:
          path: metadata.namespace
          value: homes
        template: templates/role.yaml

  - it: gives sandboxes no ServiceAccount token
    template: templates/sandbox-serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: keeps the internal port off the web Service, whatever its type
    templates:
      - templates/service.yaml
      - templates/internal-service.yaml
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.ports
          value: [{ name: http, port: 8080, targetPort: http }]
        template: templates/service.yaml
      - equal:
          path: spec.type
          value: ClusterIP
        template: templates/internal-service.yaml

  - it: lets only the gate reach Corral's internal port
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports: [{ port: http }]
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: corral
                      app.kubernetes.io/instance: corral
                      app.kubernetes.io/component: gate
              ports: [{ port: internal }]

  - it: runs the gate from the server's image and config, with the gate secret and the host key
    template: templates/gate-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/adamaq01/corral:latest
      - equal:
          path: spec.template.spec.containers[0].args
          value: [gate]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORRAL_GATE_SECRET
            valueFrom: { secretKeyRef: { name: corral-keys, key: CORRAL_GATE_SECRET } }
      - equal:
          path: spec.template.spec.serviceAccountName
          value: corral-gate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-key
            secret:
              secretName: corral-ssh-host-key
              items: [{ key: host_key, path: host_key }]
              defaultMode: 0440
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: host-key, mountPath: /etc/corral-gate, readOnly: true }

  - it: serves SSH on ssh.publicPort through a LoadBalancer that keeps client addresses
    template: templates/gate-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
      - equal:
          path: spec.ports
          value: [{ name: ssh, port: 48291, targetPort: ssh }]

  - it: sets the node port and drops the traffic policy where it does not apply
    template: templates/gate-service.yaml
    set:
      gate.service: { type: NodePort, nodePort: 30022, port: 22 }
    asserts:
      - equal:
          path: spec.ports
          value: [{ name: ssh, port: 22, targetPort: ssh, nodePort: 30022 }]

  - it: has no traffic policy on a ClusterIP Service
    template: templates/gate-service.yaml
    set:
      gate.service.type: ClusterIP
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy

  - it: serves baseUrl's host, without its port, through the Ingress
    template: templates/ingress.yaml
    set:
      baseUrl: https://corral.example.com:8443
      ingress: { enabled: true, tlsSecretName: corral-tls }
    asserts:
      - equal:
          path: spec.rules[0].host
          value: corral.example.com
      - equal:
          path: spec.tls
          value: [{ hosts: [corral.example.com], secretName: corral-tls }]

  - it: serves baseUrl's host through the HTTPRoute
    template: templates/httproute.yaml
    set:
      baseUrl: https://corral.example.com
      httpRoute: { enabled: true, parentRefs: [{ name: public, namespace: gateway }] }
    asserts:
      - equal:
          path: spec.hostnames
          value: [corral.example.com]
