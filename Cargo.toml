[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
kube = "5.1.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false }
ssh-key = "0.6.7"
tempfile = "3.27.0"
testcontainers = "0.27.3"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "1.29.3", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"

# Password hashing and SSH crypto unoptimized make the test runs that use them seconds slower.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
sha2.opt-level = 3
curve25519-dalek.opt-level = 3
ed25519-dalek.opt-level = 3
aes.opt-level = 3
aes-gcm.opt-level = 3
ghash.opt-level = 3
polyval.opt-level = 3
chacha20.opt-level = 3
poly1305.opt-level = 3
rsa.opt-level = 3
crypto-bigint.opt-level = 3
num-bigint-dig.opt-level = 3
